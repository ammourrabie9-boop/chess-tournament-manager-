<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Chess Tournament Manager</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-box">
            <h1>Reset Password</h1>
            <p class="auth-description">Enter your new password below.</p>
 
            <form id="resetPasswordForm" novalidate>
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
 
                <label for="confirmNewPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
 
                <button type="submit" id="resetPasswordButton" disabled>
                    Set New Password
                </button>
            </form>
 
            <p id="resetPasswordMessage" class="auth-message" aria-live="polite">
                Checking your password reset link...
            </p>
 
            <p class="auth-switch">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </main>
 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
