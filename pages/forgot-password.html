<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Chess Tournament Manager</title>

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <h1>
                Forgot Password
            </h1>

            <p class="auth-description">
                Enter your email address and we will send you a password reset link.
            </p>


            <form
                id="forgotPasswordForm"
                novalidate
            >

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <button
                    type="submit"
                    id="forgotPasswordButton"
                >
                    Send Reset Link
                </button>

            </form>


            <p
                id="forgotPasswordMessage"
                class="auth-message"
                aria-live="polite"
            ></p>


            <p class="auth-switch">

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </p>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase configuration -->
    <script src="../js/config.js"></script>


    <!-- Authentication -->
    <script src="../js/auth.js"></script>

</body>

</html>
